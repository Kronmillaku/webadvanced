<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
<body>

    <div class="row">
        <div class="col-xs-12 col-sm-8 col-md-4 col-sm-offset-2 col-md-offset-4"></div>
        <div class="panel panel-defualt">
            <div class="panel-heading">
                <h3 class="panel-title">Please sign up <small>Its free</small></h3>
            </div>
            <div class="panel-body">
                <form action="" role="form">
                    <div class="row">
                        <div class="col-xs-6 col-sm-6 col-md-6">
                            <div class="form-group">
                                <input type="text" name="firstname" class="form-control input-sm" placeholder="Firstname">
                            </div>
                        </div>
                        <div class="col-xs-6 col-sm-6 col-md-6">
                            <div class="form-group">
                                <input type="text" name="lastname" class="form-control input-sm" placeholder="Lastname">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" class="form-control input-sm" placeholder="Email Address">

                    </div>
                    <div class="row">
                        <div class="col-xs-6 col-sm-6 col-md-4">
                            <div class="form-group">
                                <input type="password" name="password" class="form-control input-sm" placeholder="Password" >

                            </div>
                        </div>
                        <div class="col-xs-6 col-sm-6 col-md-4">
                            <div class="form-group">
                                <input type="password" name="password_confirmation" class="form-control input-sm" placeholder=" Confirm Password" >
                                
                            </div>
                        </div>
                    </div>
                    <input type="submit" value="register" class="btn btn-info btn-block">
                </form>
            </div>
        </div>
    </div>


   <script src="js/bootstrap.min.js"></script>

</body>
</html>
